# 9router — Docker Compose stack.
#
# SQLite (default, backward compatible):
#   docker compose up -d
#
# MariaDB (opt-in via profile):
#   echo "DB_MODE=mariadb" >> .env
#   docker compose --profile mariadb up -d
#
# `./start.sh` is a thin wrapper around these commands (see ./start.sh help).
#
# The app service is built from LOCAL source (this repo) as image `9router:local`
# rather than pulled from Docker Hub. `decolua/9router:latest` is a published
# snapshot that can lag behind the repo (e.g. it predates MariaDB support), so
# building locally guarantees the running image matches the current source.
#   docker compose build 9router
#   docker compose [--profile mariadb] up -d --build
services:
  9router:
    image: 9router:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
      # Database mode: "sqlite" (default) or "mariadb".
      # For MariaDB: set DB_MODE=mariadb in .env, then:
      #   docker compose --profile mariadb up
      DB_MODE: ${DB_MODE:-sqlite}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-9router}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-9router}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      # Set to 1 to force a re-run of the one-time SQLite -> MariaDB copy.
      # Normally injected by `./start.sh migrate`.
      DB_MIGRATE_FORCE: ${DB_MIGRATE_FORCE:-0}
      # Bundled SearXNG web-search sidecar (see the `searxng` service below).
      # `searxng` resolves on 9router-net; override to point at a remote
      # instance, e.g. SEARXNG_URL=https://searx.example.com/search.
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080/search}
    networks:
      - 9router-net
    depends_on:
      headroom:
        condition: service_started
        required: false
      mariadb:
        condition: service_healthy
        required: false
      searxng:
        condition: service_healthy
        required: false

  mariadb:
    image: ${MARIA_IMAGE:-mariadb:11}
    container_name: 9router-mariadb
    restart: always
    profiles:
      - mariadb
    command:
      - --port=${DB_PORT:-3306}
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MARIA_HOST_PORT:-${DB_PORT:-3306}}:${DB_PORT:-3306}"
    environment:
      # Root password falls back to DB_PASSWORD when DB_ROOT_PASSWORD is unset.
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
      MARIADB_DATABASE: ${DB_NAME:-9router}
      MARIADB_USER: ${DB_USER:-9router}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - 9router-mariadb-data:/var/lib/mysql
    networks:
      - 9router-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"
    networks:
      - 9router-net

  # Bundled SearXNG instance for the built-in web-search provider.
  #
  # Always-on (not profile-gated) so plain `docker compose up -d` yields working
  # web search out of the box. It is internal-only: no host port is published,
  # and the app reaches it by DNS name `searxng` on the shared 9router-net.
  #
  # The image defaults to listening on 8080 (GRANIAN_PORT), which is what the
  # 9router provider expects via SEARXNG_URL.
  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    container_name: 9router-searxng
    restart: always
    environment:
      # Session-signing key. The image honours SEARXNG_SECRET and it takes
      # precedence over `server.secret_key` in settings.yml. Using `${VAR:-…}`
      # (rather than `${VAR:-}`) keeps the generated default even when the var
      # is set-but-empty, which would otherwise blank the key and break SearXNG.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-au3wChJMRnemqZaLwxtD0Pv5xufhYqJnlPkhTiXptpU}
    volumes:
      # Writable config/state dir (named volume, declared below).
      - 9router-searxng-data:/etc/searxng
      # Our minimal settings file overrides the image default. It enables the
      # JSON output format the 9router provider requests (`?format=json`) and
      # disables the rate limiter. Read-only: the container never edits it.
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - 9router-net
    healthcheck:
      # Image ships wget; /healthz returns "OK" (verified against this tag).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # No host port published by default (internal-only). To debug from the host,
    # uncomment the mapping below and browse http://localhost:8090 (8090 is the
    # searxng port reserved in .env):
    # ports:
    #   - "8090:8080"

volumes:
  9router-data:
    name: 9router-data
  9router-mariadb-data:
    name: 9router-mariadb-data
  9router-searxng-data:
    name: 9router-searxng-data

networks:
  9router-net:
    name: 9router-net
